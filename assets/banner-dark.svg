<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 64px; font-weight: 700; fill: #f0f3f6; }
    .sub { font-size: 17px; fill: #8b949e; letter-spacing: 1.5px; }
    .accent { fill: #ff7a59; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .fade { opacity: 0; animation: in .9s ease-out .25s forwards; }
    .fade2 { opacity: 0; animation: in .9s ease-out .7s forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
  <g class="fade">
    <text class="t title" x="436" y="112" text-anchor="middle">Isaac Yong <tspan class="accent">/</tspan></text>
    <rect class="cursor" x="664" y="66" width="30" height="56" rx="3" fill="#ff7a59" opacity=".85"/>
  </g>
  <text class="t sub fade2" x="450" y="160" text-anchor="middle">computer science · econometrics · monash university</text>
</svg>
